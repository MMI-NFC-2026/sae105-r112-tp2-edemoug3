<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil | Chats et chiens</title>
  <link rel="stylesheet" href="src/css/styles.css">
</head>

<body>
  <header class="header header--home">

    <!-- popovertarget relie le bouton à l'id du menu ; le navigateur gère son ouverture/fermeture sans JavaScript.
         Documentation : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Elements/button#popovertarget -->
    <button class="burger" type="button" popovertarget="menu" aria-label="Menu">
      🍔
    </button>

    <!-- popover crée un panneau natif masqué par défaut ; sa valeur vide équivaut à popover="auto"
         (fermeture possible avec Échap ou en cliquant à l'extérieur).
         Documentation : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Global_attributes/popover -->
    <nav class="menu" id="menu" popover aria-label="Menu principal">
      <!-- popovertargetaction="hide" ferme explicitement le menu ; autofocus place le focus ici à son ouverture.
           Documentation : https://developer.mozilla.org/fr/docs/Web/HTML/Reference/Global_attributes/autofocus -->
      <button
        class="menu__close burger burger--close"
        type="button"
        popovertarget="menu"
        popovertargetaction="hide"
        aria-label="Fermer le menu"
        autofocus
      >
        🍔
      </button>
      <h4>Menu</h4>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li>
          <a href="cats/index.html">Chats</a>
          <ul>
            <li><a href="cats/chat-1.html">Chat qui bâille</a></li>
            <li><a href="cats/chat-2.html">Chat tigré prudent</a></li>
          </ul>
        </li>
        <li>
          <a href="dogs/index.html">Chiens</a>
          <ul>
            <li><a href="dogs/chien-1.html">Berger allemand</a></li>
            <li><a href="dogs/chien-2.html">Berger allemand qui veut jouer</a></li>
          </ul>
        </li>
      </ul>
    </nav>
    <!-- Fin du menu principal -->
  </header>

  <!-- Contenu principal de la page -->
  <main>
    <h1>Chats et chiens</h1>
    <p>
      Bienvenue ! Découvrez les chats et les chiens à travers les pages de ce site.
    </p>
    <ul>
      <li><a href="cats/index.html">Voir les chats</a></li>
      <li><a href="dogs/index.html">Voir les chiens</a></li>
    </ul>
  </main>
  <!-- Fin du contenu principal -->

</body>

</html>
